name: electionsarchive

services:
  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: electionsarchive
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -U, postgres]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres:
  redis:
