<!doctype html>
<html lang="%lang%">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
    <link
      rel="icon"
      href="%sveltekit.assets%/favicon.svg"
      type="image/svg+xml"
    />
    <link
      rel="apple-touch-icon"
      href="%sveltekit.assets%/apple-touch-icon.png"
    />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <script>
      (() => {
        const agent = navigator.userAgent;
        const isAppleTouch =
          /iPhone|iPad|iPod/.test(agent) ||
          (/Macintosh/.test(agent) && navigator.maxTouchPoints > 1);

        if (!isAppleTouch || !CSS.supports("font", "-apple-system-body"))
          return;

        // WebKit exposes Dynamic Type only through this font; 17px is its default size.
        const probe = document.createElement("span");
        probe.style.cssText =
          "position:absolute;visibility:hidden;font:-apple-system-body";

        const apply = () => {
          document.documentElement.append(probe);
          const scale = Math.min(
            Math.max(parseFloat(getComputedStyle(probe).fontSize) / 17, 1),
            2,
          );
          probe.remove();
          document.documentElement.style.fontSize =
            scale === 1 ? "" : `${scale * 100}%`;
        };

        apply();
        addEventListener("pageshow", apply);
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") apply();
        });
      })();
    </script>
    <script>
      addEventListener(
        "pointerover",
        (event) => {
          const pointer = event.pointerType === "mouse" ? "fine" : "coarse";
          if (document.documentElement.dataset.pointer !== pointer)
            document.documentElement.dataset.pointer = pointer;
        },
        { capture: true, passive: true },
      );
    </script>
    <script>
      (() => {
        const INERT =
          'button, [role="button"], [role="tab"], [role="switch"], [role="menuitem"], [role="option"]';
        let isHolding = true;
        let isReplaying = false;
        let held = null;
        let last = null;

        const replay = (target, click) => {
          isReplaying = true;
          if (click.detail === 0) target.click();
          else {
            const init = {
              bubbles: true,
              cancelable: true,
              composed: true,
              button: 0,
              isPrimary: true,
              clientX: click.clientX,
              clientY: click.clientY,
              pointerType:
                click.pointerType ??
                (matchMedia("(pointer: coarse)").matches ? "touch" : "mouse"),
            };
            for (const [type, extra] of [
              ["pointerdown", { buttons: 1 }],
              ["pointerup", {}],
              ["click", { detail: click.detail }],
            ])
              target.dispatchEvent(
                new PointerEvent(type, { ...init, ...extra }),
              );
          }
          isReplaying = false;
        };

        addEventListener(
          "click",
          (event) => {
            if (event.isTrusted || isReplaying) {
              last = event;
              const target = isHolding && event.target.closest?.(INERT);
              if (
                target &&
                target.closest("a[href]") == null &&
                !(target.type === "submit" && target.form != null)
              )
                held = { target, event };
            } else if (last != null && event.target.contains?.(last.target)) {
              event.stopImmediatePropagation();
              event.preventDefault();
              const { target } = event;
              const click = last;
              last = null;
              setTimeout(() => replay(target, click));
            }
          },
          true,
        );

        addEventListener("click", (event) => {
          if (event === last) last = null;
        });

        addEventListener(
          "hydrated",
          () => {
            isHolding = false;
            if (held?.target.isConnected) replay(held.target, held.event);
          },
          { once: true },
        );
      })();
    </script>
    <script>
      try {
        document.documentElement.dataset.mode =
          localStorage.getItem("mode-watcher-mode") ?? "system";
      } catch {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
