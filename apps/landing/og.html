<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Elections Archive share image</title>
    <style>
      @font-face {
        font-family: "Sofia Sans Semi Condensed Variable";
        font-weight: 1 1000;
        src: url("public/fonts/sofia-sans-semi-condensed.woff2")
          format("woff2-variations");
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        inline-size: 1200px;
        block-size: 630px;
        display: grid;
        grid-template-rows: 96px 1fr 72px;
        overflow: hidden;
        background: #ffffff;
        color: #15171a;
        font-family: "Sofia Sans Semi Condensed Variable", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      body > * {
        padding-inline: 56px;
      }

      header,
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      header {
        border-block-end: 2px solid #dadde2;
      }

      footer {
        border-block-start: 2px solid #dadde2;
        color: #5b616a;
        font-size: 26px;
      }

      .lockup {
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 36px;
        font-weight: 780;
        letter-spacing: -0.015em;
      }

      .status {
        color: #5b616a;
        font-size: 26px;
      }

      h1 {
        align-self: center;
        max-inline-size: 19ch;
        font-size: 100px;
        font-weight: 780;
        line-height: 0.98;
        letter-spacing: -0.022em;
        text-wrap: balance;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="lockup">
        <svg width="52" height="52" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="3" fill="#ffe03a" />
          <path
            fill="none"
            stroke="#15171a"
            stroke-width="2.4"
            stroke-linecap="square"
            d="M9.5 7 V25 M13.75 7 V25 M18 7 V25 M22.25 7 V25 M5.5 21 L26.5 11"
          />
        </svg>
        Elections Archive
      </span>
      <span class="status">In preparation</span>
    </header>
    <h1>Every election in the world, down to the ballot box.</h1>
    <footer>www.electionsarchive.com</footer>
  </body>
</html>
