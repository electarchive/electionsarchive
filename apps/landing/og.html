<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Elections Archive share image</title>
    <style>
      @font-face {
        font-family: "Sofia Sans Semi Condensed Variable";
        font-weight: 1 1000;
        src: url("public/fonts/sofia-sans-semi-condensed.woff2")
          format("woff2-variations");
      }

      @font-face {
        font-family: "Sofia Sans Semi Condensed Variable";
        font-weight: 1 1000;
        src: url("../web/node_modules/@fontsource-variable/sofia-sans-semi-condensed/files/sofia-sans-semi-condensed-latin-ext-wght-normal.woff2")
          format("woff2-variations");
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
          U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
          U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }

      @font-face {
        font-family: "Piazzolla Variable";
        font-weight: 100 900;
        src: url("../web/node_modules/@fontsource-variable/piazzolla/files/piazzolla-latin-ext-opsz-normal.woff2")
          format("woff2-variations");
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
          U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
          U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }

      @font-face {
        font-family: "Piazzolla Variable";
        font-weight: 100 900;
        src: url("../web/node_modules/@fontsource-variable/piazzolla/files/piazzolla-latin-opsz-normal.woff2")
          format("woff2-variations");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }

      :root {
        --ink: #15171a;
        --muted: #5b616a;
        --rule: #dadde2;
        --paper: #ffffff;
        --ground: #ffe03a;
        --shadow: 92 70 0;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        position: relative;
        inline-size: 1200px;
        block-size: 630px;
        overflow: hidden;
        background:
          radial-gradient(
            130% 110% at 8% 0%,
            rgb(255 255 255 / 0.16),
            rgb(255 255 255 / 0) 55%
          ),
          radial-gradient(
            90% 90% at 100% 100%,
            rgb(var(--shadow) / 0.1),
            rgb(var(--shadow) / 0) 70%
          ),
          var(--ground);
        color: var(--ink);
        font-family: "Sofia Sans Semi Condensed Variable", sans-serif;
        font-variant-numeric: lining-nums tabular-nums;
        -webkit-font-smoothing: antialiased;
      }

      .copy {
        position: absolute;
        z-index: 2;
        inset-block: 60px 58px;
        inset-inline-start: 64px;
        display: flex;
        flex-direction: column;
        inline-size: 450px;
      }

      .lockup {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 30px;
        font-weight: 780;
        letter-spacing: -0.012em;
      }

      .lockup svg {
        display: block;
      }

      h1 {
        margin-block-start: auto;
        font-size: 70px;
        font-weight: 820;
        line-height: 0.93;
        letter-spacing: -0.03em;
      }

      .url {
        margin-block-start: 26px;
        font-size: 23px;
        font-weight: 560;
        opacity: 0.6;
      }

      .desk {
        position: absolute;
        inset-block-start: -105px;
        inset-inline-start: 470px;
        inline-size: 1100px;
        block-size: 1100px;
        perspective: 1800px;
        perspective-origin: 25% 15%;
      }

      .plane {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        transform: rotateX(var(--rx)) rotateZ(var(--rz)) scale(var(--k));
      }

      .sheet,
      .shade {
        position: absolute;
        border-radius: 2px;
      }

      .sheet {
        padding: 22px 24px 20px;
        background: var(--paper);
        box-shadow:
          0 0 0 0.5px rgb(var(--shadow) / 0.2),
          1px 1px 1px rgb(var(--shadow) / 0.16);
      }

      .sheet::after {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(
          160deg,
          rgb(255 255 255 / 0) 40%,
          rgb(var(--shadow) / 0.03)
        );
        content: "";
        pointer-events: none;
      }

      .shade {
        background: rgb(var(--shadow) / calc(0.3 * var(--lift, 0)));
        box-shadow:
          3px 7px 10px -3px rgb(var(--shadow) / 0.2),
          10px 24px 36px -10px rgb(var(--shadow) / 0.28),
          24px 60px 90px -30px rgb(var(--shadow) / 0.24);
      }

      .t {
        font-size: 25px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.022em;
      }

      .meta {
        margin-block-start: 6px;
        color: var(--muted);
        font-size: 12px;
      }

      .lede {
        margin-block-start: 12px;
        font-family: "Piazzolla Variable", serif;
        font-size: 14.5px;
        font-variation-settings: "opsz" 14;
        line-height: 1.36;
      }

      .bar {
        margin-block-start: 16px;
      }

      .nums {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
      }

      .nums > :last-child {
        text-align: end;
      }

      .big {
        font-size: 30px;
        font-weight: 720;
        line-height: 0.9;
        letter-spacing: -0.01em;
      }

      .lab {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-block-start: 3px;
        font-size: 10.5px;
      }

      .nums > :last-child .lab {
        justify-content: flex-end;
      }

      .lab em,
      .legend em {
        color: var(--muted);
        font-style: normal;
      }

      .mid {
        padding-block-end: 2px;
        color: var(--muted);
        font-size: 10px;
        text-align: center;
      }

      .track {
        position: relative;
        display: flex;
        gap: 1px;
        block-size: 11px;
        margin-block-start: 5px;
      }

      .tick {
        position: absolute;
        inset-block: -3px;
        inline-size: 1.5px;
        background: var(--ink);
      }

      .lab i,
      .tbl i,
      .legend i {
        display: inline-block;
        inline-size: 8px;
        block-size: 8px;
      }

      .tbl {
        inline-size: 100%;
        margin-block-start: 14px;
        border-collapse: collapse;
        font-size: 12px;
        table-layout: fixed;
      }

      .tbl th {
        padding-block-end: 5px;
        border-block-end: 0.75px solid var(--rule);
        color: var(--muted);
        font-size: 10px;
        font-weight: 500;
        text-align: end;
      }

      .tbl th:first-child {
        text-align: start;
      }

      .tbl th:nth-child(2) {
        inline-size: 74px;
      }

      .tbl th:nth-child(3) {
        inline-size: 48px;
      }

      .tbl td {
        padding-block: 6px;
        border-block-end: 0.75px solid var(--rule);
        text-align: end;
        white-space: nowrap;
      }

      .tbl td:first-child {
        padding-inline-start: 6px;
        text-align: start;
      }

      .tbl td:first-child i {
        margin-inline-end: 5px;
      }

      .tbl .p {
        display: block;
        margin-block-start: 1px;
        margin-inline-start: 13px;
        color: var(--muted);
        font-size: 10.5px;
      }

      .tbl .s {
        position: relative;
      }

      .tbl u {
        position: absolute;
        inset-block-end: 3px;
        inset-inline-end: 0;
        block-size: 2px;
        text-decoration: none;
      }

      .badge {
        display: inline-block;
        margin-inline-start: 5px;
        padding-inline: 4px;
        background: var(--c);
        font-size: 9.5px;
        line-height: 14px;
        vertical-align: 1px;
      }

      svg.fig {
        display: block;
        margin: 12px auto 0;
      }

      svg.map path {
        stroke: #ffffff;
        stroke-linejoin: round;
        stroke-width: 2.5;
      }

      .cap {
        margin-block-start: 10px;
        color: var(--muted);
        font-size: 10.5px;
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
        margin-block-start: 10px;
        font-size: 10.5px;
      }

      .cap + .legend {
        margin-block-start: 5px;
      }

      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .legend em {
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="lockup">
        <svg width="44" height="44" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="3" fill="#15171a" />
          <path
            fill="none"
            stroke="#ffe03a"
            stroke-width="2.4"
            stroke-linecap="square"
            d="M9.5 7 V25 M13.75 7 V25 M18 7 V25 M22.25 7 V25 M5.5 21 L26.5 11"
          />
        </svg>
        Elections Archive
      </div>
      <h1>Every election in the world, down to the ballot box.</h1>
      <div class="url">electionsarchive.com</div>
    </div>
    <div class="desk"><div class="plane"></div></div>
    <script src="og-data.js"></script>
    <script>
      const END = 9.5;
      const GRAY = "#a0a4aa";
      const BLANK = "#dde0e4";
      const WHITE = "#ffffff";
      const LEANS = [0.26, 0.4, 0.54, 0.68, 0.84, 1];
      const NYC = ["#1a5fb4", "#a5361e", "#007a56", "#7a43a1"];
      const count = new Intl.NumberFormat("en-US");
      const percent = (share) => `${(100 * share).toFixed(1)}%`;
      const clamp = (value) => Math.min(1, Math.max(0, value));
      const span = (t, from, to) => clamp((t - from) / (to - from));
      const ease = (p) => 1 - (1 - p) ** 3;
      const spread = (u) => 0.5 - Math.sin(Math.asin(1 - 2 * u) / 3);

      const linear = (v) =>
        v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4;
      const gamma = (v) =>
        v <= 0.0031308 ? 12.92 * v : 1.055 * v ** (1 / 2.4) - 0.055;
      const labs = new Map();

      function lab(color) {
        if (labs.has(color)) {
          return labs.get(color);
        }
        const [r, g, b] = [1, 3, 5].map((i) =>
          linear(parseInt(color.slice(i, i + 2), 16) / 255),
        );
        const l = Math.cbrt(
          0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b,
        );
        const m = Math.cbrt(
          0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b,
        );
        const s = Math.cbrt(
          0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b,
        );
        const value = [
          0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s,
          1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s,
          0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s,
        ];
        labs.set(color, value);
        return value;
      }

      function hex([L, A, B]) {
        const l = (L + 0.3963377774 * A + 0.2158037573 * B) ** 3;
        const m = (L - 0.1055613458 * A - 0.0638541728 * B) ** 3;
        const s = (L - 0.0894841775 * A - 1.291485548 * B) ** 3;
        const channels = [
          4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
          -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
          -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s,
        ];
        return `#${channels
          .map((v) =>
            Math.round(255 * clamp(gamma(v)))
              .toString(16)
              .padStart(2, "0"),
          )
          .join("")}`;
      }

      function mix(from, to, t) {
        const a = lab(from);
        const b = lab(to);
        return hex(a.map((v, i) => v + (b[i] - v) * t));
      }

      function onColor(color) {
        const [r, g, b] = [1, 3, 5].map(
          (i) => parseInt(color.slice(i, i + 2), 16) / 255,
        );
        return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.55 ? "#15171a" : WHITE;
      }

      function random(seed) {
        let state = seed;
        return () => {
          state = (state * 1664525 + 1013904223) % 4294967296;
          return state / 4294967296;
        };
      }

      function arrivals(size, seed, from, to) {
        const next = random(seed);
        return Array.from(
          { length: size },
          () => from + (to - from) * spread(next()),
        );
      }

      function seatBar(left, right, segments, total, mid) {
        const side = (party) =>
          `<div><div class="big">${party.seats}</div><div class="lab"><i style="background:${party.color}"></i>${party.label}${party.change != null ? ` <em>${party.change}</em>` : ""}</div></div>`;
        return `<div class="bar"><div class="nums">${side(left)}${mid != null ? `<div class="mid">${mid}</div>` : ""}${side(right)}</div><div class="track">${segments.map((color) => `<b style="background:${color}"></b>`).join("")}<span class="tick" style="left:calc(${(100 * (Math.floor(total / 2) + 1)) / total}% - 0.75px)"></span></div></div>`;
      }

      function playBar(sheet) {
        const [left, right] = sheet.querySelectorAll(".big");
        const changes = sheet.querySelectorAll(".lab em");
        const segments = [...sheet.querySelectorAll(".track b")];
        return (seats, flexes, change) => {
          left.textContent = seats[0];
          right.textContent = seats[1];
          for (const em of changes) {
            em.style.opacity = change;
          }
          for (const [i, segment] of segments.entries()) {
            segment.style.flex = flexes[i];
            segment.style.display = flexes[i] > 0 ? "" : "none";
          }
        };
      }

      function table(rows) {
        return `<table class="tbl"><thead><tr><th>Candidate or party</th><th>Votes</th><th>Share</th></tr></thead><tbody>${rows
          .map(
            (row) =>
              `<tr style="--c:${row.color}"><td><i style="background:${row.color}"></i>${row.label}${row.badge != null ? `<span class="badge" style="color:${onColor(row.color)}">${row.badge}</span>` : ""}<span class="p">${row.party}</span></td><td></td><td class="s"><span></span><u style="background:${row.color}"></u></td></tr>`,
          )
          .join("")}</tbody></table>`;
      }

      function playTable(sheet, rows, counting, winning) {
        const top = Math.max(...rows.map((row) => row.share));
        const cells = [...sheet.querySelectorAll(".tbl tbody tr")].map(
          (tr) => ({
            tr,
            votes: tr.children[1],
            share: tr.querySelector(".s span"),
            bar: tr.querySelector("u"),
            badge: tr.querySelector(".badge"),
          }),
        );
        return (t) => {
          const p = ease(span(t, ...counting));
          const w = ease(span(t, ...winning));
          for (const [i, row] of rows.entries()) {
            const cell = cells[i];
            cell.votes.textContent = count.format(Math.round(row.votes * p));
            cell.share.textContent = percent(row.share * p);
            cell.bar.style.width = `${(40 * row.share * p) / top}px`;
            if (cell.badge != null) {
              for (const td of cell.tr.children) {
                td.style.background = mix(WHITE, row.color, 0.14 * w);
              }
              cell.tr.children[0].style.boxShadow = `inset ${3 * w}px 0 0 ${row.color}`;
              cell.badge.style.opacity = w;
              cell.badge.style.transform = `scale(${0.85 + 0.15 * w})`;
            }
          }
        };
      }

      function hemicycle(parties, size, width) {
        const rows = Math.max(3, Math.round(Math.sqrt(size / 3.2)));
        const inner = 0.38;
        const radii = Array.from(
          { length: rows },
          (_, i) => inner + ((1 - inner) * i) / (rows - 1),
        );
        let sum = 0;
        for (const radius of radii) {
          sum += radius;
        }
        const counts = radii.map((radius) => Math.round((size * radius) / sum));
        let placed = 0;
        for (const value of counts) {
          placed += value;
        }
        for (let i = rows - 1; placed !== size; i = (i - 1 + rows) % rows) {
          const step = Math.sign(size - placed);
          counts[i] += step;
          placed += step;
        }
        const seats = [];
        for (const [i, radius] of radii.entries()) {
          for (let j = 0; j < counts[i]; j++) {
            const angle = Math.PI - (Math.PI * (j + 0.5)) / counts[i];
            seats.push({
              angle,
              x: radius * Math.cos(angle),
              y: radius * Math.sin(angle),
            });
          }
        }
        seats.sort((a, b) => b.angle - a.angle);
        const colors = [];
        for (const [color, seated] of parties) {
          for (let i = 0; i < seated; i++) {
            colors.push(color);
          }
        }
        const height = width * 0.54;
        const unit = width / 2.08;
        const dot = ((0.62 * (1 - inner)) / (rows - 1)) * unit * 0.49;
        return `<svg class="fig" width="${width}" height="${height}">${seats
          .map(
            (seat, i) =>
              `<circle cx="${(width / 2 + seat.x * unit).toFixed(2)}" cy="${(height - 4 - seat.y * unit).toFixed(2)}" data-r="${dot.toFixed(2)}" fill="${colors[i]}"/>`,
          )
          .join("")}</svg>`;
      }

      function hexes(cells, size) {
        const points = cells.map(([q, r, color]) => ({
          x: Math.sqrt(3) * size * (q + 0.5 * (Math.abs(r) % 2)),
          y: -1.5 * size * r,
          color,
        }));
        const xs = points.map((point) => point.x);
        const ys = points.map((point) => point.y);
        const left = Math.min(...xs);
        const top = Math.min(...ys);
        const width = Math.max(...xs) - left + Math.sqrt(3) * size;
        const height = Math.max(...ys) - top + 2 * size;
        const corner = (cx, cy, i) => {
          const angle = (Math.PI / 3) * i + Math.PI / 6;
          return `${(cx + 0.94 * size * Math.cos(angle)).toFixed(2)},${(cy + 0.94 * size * Math.sin(angle)).toFixed(2)}`;
        };
        return `<svg class="fig" width="${width.toFixed(1)}" height="${height.toFixed(1)}">${points
          .map((point) => {
            const cx = point.x - left + (Math.sqrt(3) * size) / 2;
            const cy = point.y - top + size;
            return `<polygon points="${[0, 1, 2, 3, 4, 5].map((i) => corner(cx, cy, i)).join(" ")}"/>`;
          })
          .join("")}</svg>`;
      }

      function legend(items) {
        return `<div class="legend">${items.map(([label, color, value]) => `<span><i style="background:${color}"></i>${label} <em>${count.format(value)}</em></span>`).join("")}</div>`;
      }

      function fill(nodes, colors, times, length, t) {
        for (const [i, node] of nodes.entries()) {
          const p = span(t, times[i], times[i] + length);
          const color = p >= 1 ? colors[i] : mix(BLANK, colors[i], p);
          if (node.getAttribute("fill") !== color) {
            node.setAttribute("fill", color);
          }
        }
      }

      function tally(keys, times, t) {
        const counts = new Map();
        for (const [i, key] of keys.entries()) {
          if (t >= times[i]) {
            counts.set(key, (counts.get(key) ?? 0) + 1);
          }
        }
        return counts;
      }

      const [obama, mccain] = OG.us08;
      const ukParties = new Map(
        OG.gb.results.map(([label, color, seats]) => [
          label,
          { label, color, seats },
        ]),
      );
      const labour = ukParties.get("Labour");
      const conservative = ukParties.get("Conservative");
      const ukBar = [
        labour.color,
        ukParties.get("Lib Dem").color,
        ukParties.get("SNP").color,
        ukParties.get("Reform").color,
        ukParties.get("Green").color,
        GRAY,
        "transparent",
        conservative.color,
      ];
      const german = OG.de13.toSorted((a, b) => a[3] - b[3]);

      const sheets = [
        {
          x: -10,
          y: 330,
          r: -2.5,
          width: 320,
          from: [-60, 620],
          at: 0.35,
          html: `<div class="t">Mayor of İstanbul</div><div class="meta">June 23, 2019</div>
            <div class="lede">Ekrem İmamoğlu won with 54.2% of the vote, 9.2 points ahead of Binali Yıldırım.</div>
            ${table(OG.ist.map(([label, party, color], i) => ({ label, party, color, badge: i === 0 ? "Elected" : null })))}`,
          setup(sheet) {
            const rows = OG.ist.map(([, , color, votes, share]) => ({
              color,
              votes,
              share,
            }));
            return playTable(sheet, rows, [1.5, 2.9], [3, 3.5]);
          },
        },
        {
          x: 745,
          y: -165,
          r: 3,
          width: 320,
          from: [560, -120],
          at: 0.6,
          html: `<div class="t">2024 United Kingdom general election</div><div class="meta">July 4, 2024</div>
            ${seatBar({ ...labour, change: "+211" }, { ...conservative, change: "−251" }, ukBar, 650)}
            ${hexes(OG.gb.cells, 3.3)}`,
          setup(sheet) {
            const bar = playBar(sheet);
            const nodes = [...sheet.querySelectorAll("polygon")];
            const colors = OG.gb.cells.map((cell) => cell[2]);
            const times = arrivals(colors.length, 2024, 1.6, 4.8);
            const named = ukBar.slice(0, 5);
            return (t) => {
              fill(nodes, colors, times, 0.25, t);
              const seated = tally(colors, times, t + 0.125);
              let total = 0;
              for (const value of seated.values()) {
                total += value;
              }
              const flexes = named.map((color) => seated.get(color) ?? 0);
              let shown = 0;
              for (const value of flexes) {
                shown += value;
              }
              const right = seated.get(conservative.color) ?? 0;
              flexes.push(total - shown - right, 650 - total, right);
              bar(
                [seated.get(labour.color) ?? 0, right],
                flexes,
                span(t, 4.8, 5.3),
              );
            };
          },
        },
        {
          x: 395,
          y: -104,
          r: -2,
          width: 310,
          from: [80, -560],
          at: 0.85,
          html: `<div class="t">2013 German federal election</div><div class="meta">September 22, 2013</div>
            ${hemicycle(
              german.map(([, color, seats]) => [color, seats]),
              631,
              262,
            )}
            ${legend(OG.de13.map(([label, color, seats]) => [label, color, seats]))}`,
          setup(sheet) {
            const nodes = [...sheet.querySelectorAll("circle")];
            const counters = sheet.querySelectorAll(".legend em");
            const colors = nodes.map((node) => node.getAttribute("fill"));
            const times = nodes.map((_, i) => 1.9 + (2 * i) / nodes.length);
            return (t) => {
              for (const [i, node] of nodes.entries()) {
                const p = ease(span(t, times[i], times[i] + 0.3));
                node.setAttribute("r", (Number(node.dataset.r) * p).toFixed(2));
              }
              const seated = tally(colors, times, t - 0.15);
              for (const [i, [, color]] of OG.de13.entries()) {
                counters[i].textContent = seated.get(color) ?? 0;
              }
            };
          },
        },
        {
          x: 20,
          y: -30,
          r: 2.5,
          width: 310,
          from: [-40, -600],
          at: 1.1,
          html: `<div class="t">2008 United States presidential election</div><div class="meta">November 4, 2008</div>
            <div class="lede">Barack Obama won 365 of the 538 electoral votes, with 52.9% of the popular vote.</div>
            ${seatBar({ label: "Obama", seats: 365, color: obama[2] }, { label: "McCain", seats: 173, color: mccain[2] }, [obama[2], "transparent", mccain[2]], 538, "270 to win")}
            ${table(OG.us08.map(([label, party, color], i) => ({ label, party, color, badge: i === 0 ? "Won" : null })))}`,
          setup(sheet) {
            const bar = playBar(sheet);
            const rows = OG.us08.map(([, , color, votes, share]) => ({
              color,
              votes,
              share,
            }));
            const play = playTable(sheet, rows, [2.3, 3.7], [3.7, 4.2]);
            return (t) => {
              const p = ease(span(t, 2.1, 3.5));
              bar(
                [Math.round(365 * p), Math.round(173 * p)],
                [365 * p, 538 * (1 - p), 173 * p],
                1,
              );
              play(t);
            };
          },
        },
        {
          x: 375,
          y: 198,
          r: 1.5,
          width: 350,
          from: [260, 620],
          at: 1.4,
          html: `<div class="t">2025 Democratic primary for Mayor of New York City</div><div class="meta">June 24, 2025</div>
            <div class="lede">Zohran Mamdani won with 56.4% of the final-round vote, 12.8 points ahead of Andrew M. Cuomo.</div>
            <svg class="fig map" width="300" height="${((300 * 3822) / 3860).toFixed(1)}" viewBox="22827 -6823 3860 3822">${OG.nyc.map(([, , d]) => `<path d="${d}"/>`).join("")}</svg>
            <div class="cap">First-round leader in each of the 4,036 election districts</div>
            ${legend(
              [
                ["Mamdani", 1986],
                ["Cuomo", 2033],
                ["Lander", 15],
                ["Adams", 2],
              ].map(([label, value], i) => [label, NYC[i], value]),
            )}`,
          setup(sheet) {
            const nodes = [...sheet.querySelectorAll("svg.map path")];
            const leaders = OG.nyc.map(([leader]) => leader);
            const colors = OG.nyc.map(([leader, lean]) =>
              mix(WHITE, NYC[leader], LEANS[lean]),
            );
            const times = arrivals(nodes.length, 2025, 2.4, 6.2);
            const counters = sheet.querySelectorAll(".legend em");
            return (t) => {
              fill(nodes, colors, times, 0.3, t);
              const led = tally(leaders, times, t + 0.15);
              for (const [i, counter] of counters.entries()) {
                counter.textContent = count.format(led.get(i) ?? 0);
              }
            };
          },
        },
      ];

      const plane = document.querySelector(".plane");
      const placed = [];
      for (const [z, sheet] of sheets.entries()) {
        const shade = document.createElement("div");
        shade.className = "shade";
        const paper = document.createElement("div");
        paper.className = "sheet";
        paper.innerHTML = sheet.html;
        for (const node of [shade, paper]) {
          node.style.left = `${sheet.x}px`;
          node.style.top = `${sheet.y}px`;
          node.style.width = `${sheet.width}px`;
        }
        plane.append(shade, paper);
        placed.push({ ...sheet, z, shade, paper });
      }

      function frame(t) {
        const camera = ease(span(t, 0, 7.5));
        plane.style.setProperty("--rx", `${32 - 2 * camera}deg`);
        plane.style.setProperty("--rz", `${-11.5 + 1.5 * camera}deg`);
        plane.style.setProperty("--k", `${0.8 + 0.02 * camera}`);
        for (const sheet of placed) {
          const p = span(t, sheet.at, sheet.at + 1.3);
          const travel = 1 - ease(p);
          const lift = 1 - ease(clamp(p * 1.15));
          const [dx, dy] = sheet.from;
          const x = dx * travel;
          const y = dy * travel;
          const turn = `rotate(${sheet.r + 7 * travel}deg)`;
          sheet.paper.style.visibility = t > sheet.at ? "" : "hidden";
          sheet.shade.style.visibility = sheet.paper.style.visibility;
          sheet.paper.style.transform = `translate3d(${x}px, ${y}px, ${3 * sheet.z + 2 + 160 * lift}px) ${turn}`;
          sheet.shade.style.setProperty("--lift", `${lift}`);
          sheet.shade.style.opacity = 1 - 0.4 * lift;
          sheet.shade.style.filter = lift > 0 ? `blur(${14 * lift}px)` : "";
          sheet.shade.style.transform = `translate3d(${x + 36 * lift}px, ${y + 44 * lift}px, ${3 * sheet.z + 1 + 160 * lift}px) ${turn}`;
          sheet.play(t);
        }
      }

      document.fonts.ready.then(() => {
        for (const sheet of placed) {
          for (const em of sheet.paper.querySelectorAll(".legend em")) {
            em.style.minWidth = `${em.offsetWidth}px`;
          }
          sheet.shade.style.height = `${sheet.paper.offsetHeight}px`;
          sheet.play = sheet.setup(sheet.paper);
        }
        frame(Number(new URLSearchParams(location.search).get("t") ?? END));
        document.body.dataset.ready = "true";
      });
    </script>
  </body>
</html>
