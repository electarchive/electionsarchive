      * {

        margin: 0;
        padding: 0;

      body {
        inline-size: 1200px;

        color: #15171a;

        padding-inline: 56px;
      }

      header,
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      header {
        border-block-end: 2px solid #dadde2;
      }

      footer {
        border-block-start: 2px solid #dadde2;
        color: #5b616a;
        font-size: 26px;
      }

      .lockup {
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 36px;
        font-weight: 780;
        letter-spacing: -0.015em;
      }

      .status {
        color: #5b616a;
        font-size: 26px;
      }

      h1 {
        align-self: center;
        max-inline-size: 19ch;
        font-size: 100px;
        font-weight: 780;
        line-height: 0.98;
        letter-spacing: -0.022em;
        text-wrap: balance;
      }

      .map {
        position: absolute;
        inset-block-start: 186px;
        inset-inline-start: 736px;
        inline-size: 420px;
        padding: 0;
      }

      .map path {
        stroke: #ffffff;
        stroke-width: 1.4;
        stroke-linejoin: round;
      }
    </style>
